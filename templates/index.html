<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #343541;
      color: #ececf1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid #4a4b53;
      font-weight: bold;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .msg {
      max-width: 800px;
      margin: 0 auto 16px auto;
      padding: 12px 16px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .user { background: #444654; }
    .bot { background: #3e3f4b; }
    .msg img { max-width: 250px; display: block; margin-bottom: 8px; border-radius: 6px; }
    form {
      padding: 16px;
      border-top: 1px solid #4a4b53;
      display: flex;
      gap: 8px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #565869;
      background: #40414f;
      color: #ececf1;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #10a37f;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    #preview { font-size: 13px; color: #aaa; align-self: center; }
  </style>
</head>
<body>
  <header>AI Chat</header>

  <div id="chat"></div>

  <form id="form">
    <input type="file" id="image" accept="image/*" style="display:none">
    <button type="button" onclick="document.getElementById('image').click()">📎</button>
    <span id="preview"></span>
    <input type="text" id="question" placeholder="Sawal likhein...">
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const questionInput = document.getElementById("question");
    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");
    const sendBtn = document.getElementById("send");

    imageInput.addEventListener("change", () => {
      preview.textContent = imageInput.files[0] ? "Image selected: " + imageInput.files[0].name : "";
    });

    function addMessage(text, cls, imageUrl) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      if (imageUrl) {
        const img = document.createElement("img");
        img.src = imageUrl;
        div.appendChild(img);
      }
      const p = document.createElement("div");
      p.textContent = text;
      div.appendChild(p);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = questionInput.value.trim();
      const file = imageInput.files[0];
      if (!question && !file) return;

      let imageUrl = file ? URL.createObjectURL(file) : null;
      addMessage(question || "(image)", "user", imageUrl);

      const data = new FormData();
      data.append("question", question);
      if (file) data.append("image", file);

      questionInput.value = "";
      imageInput.value = "";
      preview.textContent = "";
      sendBtn.disabled = true;
      addMessage("Soch raha hoon...", "bot");
      const thinking = chat.lastChild;

      try {
        const res = await fetch("/chat", { method: "POST", body: data });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (err) {
          json = { error: "Status " + res.status + ": " + text.slice(0, 300) };
        }
        thinking.remove();
        addMessage(res.ok && json.answer ? json.answer : "Error: " + (json.error || "unknown"), "bot");
      } catch (err) {
        thinking.remove();
        addMessage("Network error: " + err, "bot");
      }
      sendBtn.disabled = false;
      questionInput.focus();
    });
  </script>
</body>
</html>
