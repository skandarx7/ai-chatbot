<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body { background-color: #1e1e2f; color: #ffffff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 90%; max-width: 600px; background: #2b2b3d; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; height: 80vh; }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #444; margin-bottom: 10px; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 5px; }
        .user-msg { background: #3b3b52; align-self: flex-end; }
        .bot-msg { background: #444466; align-self: flex-start; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 5px; border: none; outline: none; }
        button { background: #00b894; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Sawal likhein...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML += `<div class="message user-msg"><b>You:</b> ${text}</div>`;
            input.value = "";

            try {
                const formData = new FormData();
                formData.append("prompt", text);

                const res = await fetch("/chat", {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();

                if (res.ok) {
                    chatBox.innerHTML += `<div class="message bot-msg"><b>AI:</b> ${data.answer}</div>`;
                } else {
                    const errStr = typeof data.error === 'object' ? JSON.stringify(data.error) : data.error;
                    chatBox.innerHTML += `<div class="message bot-msg"><b>Error:</b> ${errStr}</div>`;
                }
            } catch (err) {
                chatBox.innerHTML += `<div class="message bot-msg"><b>Error:</b> ${err.message}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
